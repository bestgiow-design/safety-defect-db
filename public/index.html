<style>

.btn-del:active{background:var(--red-bg)}

window.addLaw=function(p,prefill){

  wrap.appendChild(div);

window.delLaw=function(p,idx){const r=document.getElementById(p+'_lr_'+idx);if(r)r.remove();};
window.updLaw=function(p,idx){
  const row=document.getElementById(p+'_lr_'+idx);if(!row)return;
  const sv=row.querySelector('select').value,no=row.querySelector('input').value.trim();
  const hint=document.getElementById(p+'_lh_'+idx);
  if(sv&&no){const[n,pc]=sv.split('|');const url=`https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=${pc}&flno=${no}`;hint.innerHTML=`<a href="${url}" target="_blank">${n}第${no}條 📋</a>`;hint.style.display='block';}
  else if(sv){hint.textContent=sv.split('|')[0];hint.style.display='block';}
  else{hint.style.display='none';}
};
function getLaws(p){
  return Array.from(document.getElementById(p+'_laws_wrap').querySelectorAll('.law-row')).map(row=>{
    const sv=row.querySelector('select').value,no=row.querySelector('.law-no').value.trim();
    const customEl=row.querySelector('.law-custom');
    const customVal=customEl?customEl.value.trim():'';
    if(!sv&&!customVal)return null;
    if(!sv&&customVal)return{sel:'',name:customVal,no:'',link:''};
    const[n,pc]=sv.split('|');
    return{sel:sv,name:n,no,link:no?`https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=${pc}&flno=${no}`:''};
  }).filter(Boolean);
}
function setLaws(p,laws){
  const wrap=document.getElementById(p+'_laws_wrap');
  wrap.innerHTML='';
  if(!laws||!laws.length){addLaw(p);return;}
  laws.forEach(l=>{
    if(l.sel){
      // 新格式：有 sel，走正常流程
      addLaw(p);
      const rows=wrap.querySelectorAll('.law-row');
      const row=rows[rows.length-1];
      row.querySelector('select').value=l.sel;
      if(l.no)row.querySelector('.law-no').value=l.no;
      const idx=row.id.split('_lr_')[1];
      setTimeout(()=>updLaw(p,idx),80);
    } else {
      // 舊格式：只有 name，用 prefill 帶入自訂欄
      addLaw(p,l.name);

  });
}

        const btn2=document.createElement('div');
        btn2.style.cssText='padding:7px 10px;margin-bottom:6px;background:white;border:1px solid #c5d8f5;border-radius:8px;cursor:pointer;';

        btn2.onclick=async function(){
          lawsWrap.innerHTML='';addLaw('e');

          const realText = await fetchLawArticle(name, no);
          let matched2 = false;

          if(!matched2&&name) Array.from(sel.options).forEach(opt=>{if(opt.text&&name&&opt.text.includes(name.substring(0,8))){sel.value=opt.value;matched2=true;}});
          if(no)noEl.value=no;

window.saveRecord=async function(keepOpen){
  const title=document.getElementById('f_title').value.trim();
  if(!title){toast('請填寫缺失名稱');return;}
  const btn=keepOpen?document.getElementById('submitNextBtn'):document.getElementById('submitBtn');
  const otherBtn=keepOpen?document.getElementById('submitBtn'):document.getElementById('submitNextBtn');
  const btnLabel=btn.textContent;btn.disabled=true;otherBtn.disabled=true;btn.textContent='儲存中…';
  try{
    const photos=await Promise.all(Array.from(document.getElementById('f_photo').files).map(f=>compress(f)));const photo=photos[0]||'';
    const lawsArr=getLaws('f');
    const data={title,repeat:document.getElementById('f_repeat').checked,cat:document.getElementById('f_cat').value,sev:selSev,project:document.getElementById('f_project').value,location:document.getElementById('f_location').value,date:document.getElementById('f_date').value,desc:document.getElementById('f_desc').value,laws:lawsArr,law:lawsArr.map(l=>l.name+(l.no?'第'+l.no+'條':'')).join('、'),lawtext:document.getElementById('f_lawtext').value,hazard:document.getElementById('f_hazard').value,improve:document.getElementById('f_improve').value,plain:document.getElementById('f_plain').value,photoBase64:photo,photos:photos,createdAt:serverTimestamp()};
    const ref=await addDoc(collection(db,'defects'),data);
    records.unshift({id:ref.id,...data,createdAt:{toDate:()=>new Date()}});
    // 清空「每筆都不同」的欄位（兩種模式都清）
    ['f_title','f_desc','f_lawtext','f_hazard','f_improve','f_plain'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f_repeat').checked=false;document.getElementById('f_photo').value='';document.getElementById('photoPreview').innerHTML='';
    document.getElementById('f_cat').selectedIndex=0;
    initLaws('f');
    if(keepOpen){
      // 連續登打：沿用 案名、日期、地點、嚴重等級（不動），只清變動欄位；表單不關
      render();toast('已存，請打下一筆');
      const sheet=document.getElementById('addSheet');if(sheet)sheet.scrollTop=0;
      document.getElementById('f_title').focus();
    }else{
      // 儲存並關閉：完整清空後收起表單
      document.getElementById('f_project').value='';document.getElementById('f_location').value='';
      document.getElementById('f_date').value=new Date().toISOString().split('T')[0];
      selSev='立即危險';document.querySelectorAll('#addSheet .sev-btn').forEach(b=>b.className='sev-btn');document.querySelector('#addSheet .sev-btn').classList.add('sel-d');
      closeSheet('addSheet');render();toast('記錄已儲存');
    }
  }catch(e){toast('儲存失敗：'+e.message);}
  finally{btn.disabled=false;otherBtn.disabled=false;btn.textContent=btnLabel;}
};

window.aiGenerate = async function() {
  const title = document.getElementById('f_title').value.trim();
  if (!title) { toast('請先填寫缺失名稱'); return; }

  const btn = document.getElementById('aiGenBtn');
  const status = document.getElementById('aiStatus');
  btn.disabled = true;
  btn.innerHTML = '✨ AI 產生中…';
  status.style.display = 'block';
  status.textContent = '正在分析缺失內容，請稍候…';

  try {
    const resp = await fetch('https://aianalyze-fz6cuwkiua-uc.a.run.app', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });

    const result = await resp.json();
    if (result.error) throw new Error(result.error);

    // 填入其他欄位
    if (result.hazard) document.getElementById('f_hazard').value = result.hazard;
    if (result.improve) document.getElementById('f_improve').value = result.improve;
    if (result.plain) document.getElementById('f_plain').value = result.plain;

    // 顯示相關法條建議清單
    const lawsWrap = document.getElementById('f_laws_wrap');
    lawsWrap.innerHTML = '';
    const suggestId = 'ai_law_suggest';
    const old = document.getElementById(suggestId);
    if (old) old.remove();

    if (result.laws && result.laws.length) {
      const box = document.createElement('div');
      box.id = suggestId;
      box.style.cssText = 'margin-top:8px;padding:10px 12px;background:var(--blue-bg,#eef4ff);border:1px solid var(--blue,#3a7bd5);border-radius:10px;font-size:13px;';
      box.innerHTML = '<div style="font-weight:600;color:var(--blue-text,#1a4fa0);margin-bottom:8px">📋 AI 建議相關法條（點選帶入）</div>';
      result.laws.forEach(law => {
        const pcode = law.law_pcode || '';
        const no = law.law_no || '';
        const name = law.law_name || '';
        const lawtext = law.lawtext || '';
        const btn = document.createElement('div');
        btn.style.cssText = 'padding:7px 10px;margin-bottom:6px;background:white;border:1px solid #c5d8f5;border-radius:8px;cursor:pointer;';
        const inList = Object.keys(LAW_PCODE_MAP).includes(name);
        btn.innerHTML = '<span style="font-weight:600;color:#1a4fa0">' + name + '第' + no + '條</span>' + (!inList ? '<span style="color:#e07;font-size:11px;margin-left:6px">⚠️ 不在清單</span>' : '') + '<div style="color:#888;font-size:11px;margin-top:3px" class="law-preview">點擊查詢真實條文</div>';
        btn.onclick = async function() {
          lawsWrap.innerHTML = '';
          addLaw('f');
          const rows = lawsWrap.querySelectorAll('.law-row');
          const row = rows[rows.length - 1];
          const sel = row.querySelector('select');
          const noEl = row.querySelector('.law-no');
          const rowId = row.id.split('_lr_')[1];
          const customEl = document.getElementById('f_lc_' + rowId);
          // 查詢真實條文
          const realText = await fetchLawArticle(name, no);
          let matched = false;
          Array.from(sel.options).forEach(opt => {
            if (pcode && opt.value.includes(pcode)) { sel.value = opt.value; matched = true; }
          });
          if (!matched && name) Array.from(sel.options).forEach(opt => {
            if (opt.text && name && opt.text.includes(name.substring(0, 8))) { sel.value = opt.value; matched = true; }
          });
          if (no) noEl.value = no;
          if(realText && customEl) {
            customEl.value = realText;
            customEl.style.display = 'block';
          } else if(!matched && customEl) {
            // 不在下拉選單：直接用自訂欄位輸入法規名稱+條號
            sel.value = '';
            noEl.value = '';
            customEl.value = name + '第' + no + '條' + (realText ? '：' + realText : '');
            customEl.style.display = 'block';
          }
          setTimeout(() => updLaw('f', rowId), 80);
          document.getElementById(suggestId).remove();
        };
        box.appendChild(btn);
      });
      lawsWrap.parentNode.insertBefore(box, lawsWrap);
    }

    status.textContent = '✅ AI 已填入，請點選適合的法條後儲存';
    status.style.color = 'var(--green)';
  } catch(e) {
    status.textContent = '❌ 產生失敗，請手動填寫';
    status.style.color = 'var(--red)';
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ AI 自動產生法規、危害說明、改善建議';
  }
};

// ── 後台管理 ──
window.openAdmin = async function() {
  if(!isAdmin) return;
  document.getElementById('adminSheet').style.display='flex';
  const body = document.getElementById('adminBody');
  body.innerHTML = '<div style="text-align:center;color:#999;padding:20px">載入中...</div>';

  try {
    const snap = await getDocs(collection(db, 'users'));
    const users = snap.docs.map(d => ({uid: d.id, ...d.data()}));
    const PROJECTS = ['三鶯統包','三鶯-LB02-2','汐東統包','汐東要徑','土樹線CF650B','土樹線CF650C','土樹線CF670','淡海二期先期','基隆捷運先期','萬大二期CF840A','萬大二期CF840B','安坑廁所','安坑-LB02','臺北大學第二校門','臺北大學第二校門'];

    body.innerHTML = users.map(u => `
      <div style="padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px">
        <div style="font-weight:600;margin-bottom:4px">${u.name||u.email}</div>
        <div style="font-size:12px;color:#666;margin-bottom:10px">${u.email}</div>
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <label style="font-size:13px;font-weight:600">角色：</label>
          ${['pending','staff','vendor','admin'].map(r =>
            `<label style="font-size:13px"><input type="radio" name="role_${u.uid}" value="${r}" ${u.role===r?'checked':''}> ${{pending:'待審核',staff:'同仁',vendor:'廠商',admin:'管理員'}[r]}</label>`
          ).join('')}
        </div>
        ${u.role !== 'admin' ? (()=>{
          const checks = PROJECTS.map(p =>
            '<label style="font-size:12px;background:var(--bg2);padding:4px 8px;border-radius:6px"><input type="checkbox" name="proj_' + u.uid + '" value="' + p + '" ' + ((u.projects||[]).includes(p)||u.role==='staff'?'checked':'') + '> ' + p + '</label>'
          ).join('');
          return '<div style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><label style="font-size:13px;font-weight:600">可看案名：</label><button type="button" onclick="selectAllProjects(\'' + u.uid + '\', true)" style="font-size:11px;padding:2px 8px;border:1px solid var(--blue);color:var(--blue);background:transparent;border-radius:6px;cursor:pointer">全選</button><button type="button" onclick="selectAllProjects(\'' + u.uid + '\', false)" style="font-size:11px;padding:2px 8px;border:1px solid var(--border2);color:var(--text2);background:transparent;border-radius:6px;cursor:pointer">清除</button></div><div style="display:flex;flex-wrap:wrap;gap:6px">' + checks + '</div></div>';
        })() : ''}
        <button onclick="saveUser('${u.uid}')" style="padding:8px 16px;background:var(--blue);color:white;border:none;border-radius:8px;cursor:pointer;font-size:13px">儲存</button>
      </div>
    `).join('') || '<div style="text-align:center;color:#999;padding:20px">目前沒有使用者</div>';
  } catch(e) {
    body.innerHTML = '<div style="color:red;padding:20px">載入失敗：' + e.message + '</div>';
  }
};

window.selectAllProjects = function(uid, select) {
  document.querySelectorAll(`input[name="proj_${uid}"]`).forEach(cb => cb.checked = select);
};

window.saveUser = async function(uid) {
  const roleEl = document.querySelector(`input[name="role_${uid}"]:checked`);
  const projEls = document.querySelectorAll(`input[name="proj_${uid}"]:checked`);
  if(!roleEl) return alert('請選擇角色');
  const role = roleEl.value;
  const projs = Array.from(projEls).map(el => el.value);
  try {
    await setDoc(doc(db, 'users', uid), {role, projects: projs}, {merge: true});
    toast('✅ 儲存成功');
  } catch(e) {
    toast('❌ 儲存失敗：' + e.message);
  }
};

// ── 查詢真實法條 ──
const LAW_PCODE_MAP = {
  '職業安全衛生法': 'N0060001',
  '職業安全衛生設施規則': 'N0060009',
  '營造安全衛生設施標準': 'N0060014',
  '職業安全衛生管理辦法': 'N0060008',
  '危險性機械及設備安全檢查規則': 'N0060006',
  '營建工程空氣污染防制設施管理辦法': 'O0040009',
};
const lawCache = {};

async function fetchLawArticle(lawName, articleNo) {
  const pcode = LAW_PCODE_MAP[lawName];
  if(!pcode) return null;
  const cacheKey = pcode + '_' + articleNo;
  if(lawCache[cacheKey]) return lawCache[cacheKey];
  try {
    const url = `https://raw.githubusercontent.com/kong0107/mojLawSplit/arranged/json/${pcode}.json`;
    const resp = await fetch(url);
    if(!resp.ok) return null;
    const data = await resp.json();
    const articles = data.articles || data.LawArticles?.LawArticle || [];
    // 找到對應條號
    const no = String(articleNo).replace(/[^\d]/g,'');
    const found = articles.find(a => {
      const aNo = String(a.number || a.ArticleNo || '').replace(/[^\d]/g,'');
      return aNo === no;
    });
    if(found) {
      const text = found.content || found.ArticleContent || '';
      lawCache[cacheKey] = text;
      return text;
    }
    return null;
  } catch(e) {
    console.log('法條查詢失敗:', e);
    return null;
  }
}

// ── Auth ──
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

// 登入函數：standalone 模式用 redirect，一般 Safari 用 popup


window.loginWithGoogle = async function() {
  const isStandalone = window.navigator.standalone === true;
  try {
    if(isStandalone) {
      // 主畫面 App 模式：用 redirect
      await signInWithRedirect(auth, provider);
    } else {
      // 一般瀏覽器：用 popup
      await signInWithPopup(auth, provider);
    }
  } catch(e) {
    if(e.code !== 'auth/popup-closed-by-user') {
      alert('登入失敗：' + e.message);
    }
  }
};

window.doSignOut = async function() {
  if(confirm('確定要登出？')) await signOut(auth);
};

onAuthStateChanged(auth, async user => {
  if(user) {
    currentUser = user;
    isAdmin = ADMIN_EMAILS.includes(user.email);

    // 取得或建立使用者文件
    const userRef = doc(db, 'users', user.uid);
    let userSnap = await getDoc(userRef);

    if(!userSnap.exists()) {
      // 新使用者，建立待審核文件
      await setDoc(userRef, {
        email: user.email,
        name: user.displayName || '',
        role: isAdmin ? 'admin' : 'pending',
        projects: [],
        createdAt: serverTimestamp()
      });
      userSnap = await getDoc(userRef);
    }

    const userData = userSnap.data();
    userRole = isAdmin ? 'admin' : userData.role;
    userProjects = userData.projects || [];

    // 根據角色顯示畫面
    if(userRole === 'pending') {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('pendingScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('userBar').style.display = 'none';
      return;
    }

    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('pendingScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('userBar').style.display = 'flex';
    // 廠商不能新增缺失
    const fabBtn = document.getElementById('fab');
    if(fabBtn) fabBtn.style.display = (userRole === 'vendor') ? 'none' : 'flex';

    const roleLabel = {admin:'管理員', staff:'同仁', vendor:'廠商'}[userRole] || '';
    const roleIcon = {admin:'👑', staff:'👤', vendor:'🏗️'}[userRole] || '👤';
    document.getElementById('userInfo').textContent =
      roleIcon + ' ' + (user.displayName || user.email) +
      (roleLabel ? `（${roleLabel}）` : '');
    // 管理員才顯示後台按鈕
    const adminBtn = document.getElementById('adminBtn');
    if(adminBtn) adminBtn.style.display = isAdmin ? 'block' : 'none';

    await loadProjects();
    await loadRecords();

  } else {
    // 無登入：直接以管理員身份進入
    currentUser = null;
    isAdmin = true;
    userRole = 'admin';
    userProjects = [];
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('pendingScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('userBar').style.display = 'none';
    await loadProjects();
    await loadRecords();
  }
});
