<title>安衛缺失資料庫</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#ececec;--text:#1a1a1a;--text2:#666;--text3:#999;--border:#e0e0e0;--border2:#ccc;--blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#185FA5;--red:#A32D2D;--red-bg:#FCEBEB;--amber:#854F0B;--amber-bg:#FAEEDA;--green:#3B6D11;--green-bg:#EAF3DE;--purple:#534AB7;--purple-bg:#EEEDFE;--radius:10px;--radius-lg:14px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;--border:#3a3a3c;--border2:#48484a;--blue:#378ADD;--blue-bg:#0c2a4a;--blue-text:#85B7EB;--red-bg:#3a1212;--amber-bg:#3a2800;--green-bg:#1a2e0a;--purple-bg:#1a1640}}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);font-size:16px;min-height:100vh}
.topbar{padding:14px 16px 0;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:.5px solid var(--border)}
.topbar-title{font-size:20px;font-weight:600;margin-bottom:10px}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-wrap{flex:1;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text3);fill:none}
.search-wrap input{width:100%;height:40px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:14px}
.cat-scroll{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.cat-scroll::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border:1.5px solid var(--border);border-radius:17px;background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;font-family:inherit;transition:all 0.15s}
.chip.active{font-weight:600;filter:brightness(0.92)}
.chip[data-cat="全部"]{background:#f0f0f0;border-color:#ccc;color:#444}
.chip[data-cat="全部"].active{background:#444;border-color:#444;color:#fff}
.chip[data-cat="一、環境保護"]{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32}
.chip[data-cat="一、環境保護"].active{background:#388e3c;border-color:#388e3c;color:#fff}
.chip[data-cat="二、個人防護具及管理"]{background:#e3f2fd;border-color:#90caf9;color:#1565c0}
.chip[data-cat="二、個人防護具及管理"].active{background:#1565c0;border-color:#1565c0;color:#fff}
.chip[data-cat="三、火災防護"]{background:#fce4ec;border-color:#f48fb1;color:#c62828}
.chip[data-cat="三、火災防護"].active{background:#c62828;border-color:#c62828;color:#fff}
.chip[data-cat="四、墜落"]{background:#fff3e0;border-color:#ffcc80;color:#e65100}
.chip[data-cat="四、墜落"].active{background:#e65100;border-color:#e65100;color:#fff}
.chip[data-cat="五、感電"]{background:#fffde7;border-color:#fff176;color:#f57f17}
.chip[data-cat="五、感電"].active{background:#f57f17;border-color:#f57f17;color:#fff}
.chip[data-cat="六、物體倒/崩塌"]{background:#efebe9;border-color:#bcaaa4;color:#4e342e}
.chip[data-cat="六、物體倒/崩塌"].active{background:#4e342e;border-color:#4e342e;color:#fff}
.chip[data-cat="七、吊掛作業/物體飛落"]{background:#f3e5f5;border-color:#ce93d8;color:#6a1b9a}
.chip[data-cat="七、吊掛作業/物體飛落"].active{background:#6a1b9a;border-color:#6a1b9a;color:#fff}
.chip[data-cat="八、物料、機具管理"]{background:#e8eaf6;border-color:#9fa8da;color:#283593}
.chip[data-cat="八、物料、機具管理"].active{background:#283593;border-color:#283593;color:#fff}
.chip[data-cat="九、交通安全及維持"]{background:#e0f7fa;border-color:#80deea;color:#006064}
.chip[data-cat="九、交通安全及維持"].active{background:#006064;border-color:#006064;color:#fff}
.chip[data-cat="十、安全衛生管理"]{background:#e8eaf6;border-color:#9fa8da;color:#283593}
.chip[data-cat="十、安全衛生管理"].active{background:#283593;border-color:#283593;color:#fff}
.chip[data-cat="十一、局限空間"]{background:#ede7f6;border-color:#b39ddb;color:#4527a0}
.chip[data-cat="十一、局限空間"].active{background:#4527a0;border-color:#4527a0;color:#fff}
.filter-row{display:flex;gap:8px;padding:8px 16px;background:var(--bg);flex-wrap:wrap;border-bottom:.5px solid var(--border)}
.filter-sel{flex:1;min-width:100px;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:13px;font-family:inherit;appearance:none;-webkit-appearance:none}
.filter-sel.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.filter-date-row{display:flex;gap:6px;align-items:center;flex:2;min-width:180px}
.filter-date-sep{font-size:13px;color:var(--text3);white-space:nowrap}
.btn-clear{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text3);font-size:13px;cursor:pointer;font-family:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px}
.stat{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;text-align:center}
.stat-n{font-size:22px;font-weight:700}
.stat-l{font-size:11px;color:var(--text2);margin-top:2px}
.list{padding:0 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:100px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;gap:12px;cursor:pointer}
.card:active{background:var(--bg2)}
.sev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.card-info{flex:1;min-width:0}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.badge{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.badge-cat{background:var(--blue-bg);color:var(--blue-text)}
.badge-d{background:var(--red-bg);color:var(--red)}
.badge-m{background:var(--amber-bg);color:var(--amber)}
.badge-rep{background:var(--purple-bg);color:var(--purple)}
.card-title{font-size:15px;font-weight:600;margin-bottom:3px}
.card-desc{font-size:13px;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-law{font-size:12px;color:var(--text3);margin-top:4px}
.card-meta{font-size:12px;color:var(--text3);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-arrow{color:var(--text3);flex-shrink:0;margin-top:2px}
.card-img{width:90px;height:90px;border-radius:8px;object-fit:cover;flex-shrink:0}
.card-img-ph{width:90px;height:90px;border-radius:8px;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.fab{position:fixed;bottom:24px;right:20px;z-index:20}
.fab-btn{height:52px;padding:0 22px;background:var(--blue);border:none;border-radius:26px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(24,95,165,.4);font-family:inherit}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,16px)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1}
.sheet-head h2{font-size:17px;font-weight:600}
.sheet-close{width:44px;height:44px;border:none;background:var(--bg2);border-radius:50%;cursor:pointer;color:var(--text2);font-size:22px;font-weight:300;display:flex;align-items:center;justify-content:center;line-height:1;transition:background 0.2s,color 0.2s}.sheet-close:hover{background:#e0e0e0;color:#333}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:5px}
.fl label{font-size:13px;color:var(--text2);font-weight:500}
.fl input,.fl select,.fl textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:15px;font-family:inherit;appearance:none;-webkit-appearance:none}
.fl textarea{min-height:76px;resize:vertical}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sev-sel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sev-btn{height:44px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit}
.sev-btn.sel-d{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:600}
.sev-btn.sel-m{background:var(--amber-bg);border-color:#BA7517;color:var(--amber);font-weight:600}
.proj-row{display:flex;gap:8px;align-items:center}
.proj-sel{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:15px;font-family:inherit;appearance:none}
.btn-proj{height:42px;padding:0 14px;border:1px solid var(--blue);border-radius:10px;background:transparent;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.law-row{background:var(--bg2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.law-row-top{display:flex;gap:6px;align-items:center}
.law-sel{width:200px;height:36px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;appearance:none}
.law-no{width:75px;height:36px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.law-del{width:30px;height:30px;border:none;background:none;color:var(--text3);font-size:20px;cursor:pointer;flex-shrink:0}
.law-hint{font-size:12px;color:var(--blue);display:none;padding-top:2px}
.btn-add-law{height:36px;padding:0 14px;border:1px dashed var(--border2);border-radius:8px;background:transparent;color:var(--blue);font-size:13px;cursor:pointer;font-family:inherit;text-align:left;margin-top:4px}
.photo-area{border:1.5px dashed var(--border2);border-radius:12px;padding:20px;text-align:center;cursor:pointer;color:var(--text2);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.photo-area input{display:none}
.btn-submit{height:50px;background:var(--blue);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
.btn-submit:disabled{opacity:.5}
.btn-edit{height:30px;padding:0 14px;border:1px solid var(--border2);border-radius:15px;background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit}
.section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px;font-weight:600}
.detail-img{width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:var(--bg2)}
.detail-img-ph{height:160px;background:var(--bg2);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-direction:column;gap:8px;font-size:13px}
.law-box{background:var(--bg2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;line-height:1.6}
.info-box{padding:10px 14px;font-size:13px;line-height:1.6;border-radius:0 8px 8px 0}
.btn-del{width:100%;height:46px;border:1px solid #e24b4a;border-radius:12px;background:transparent;color:var(--red);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-del:active{background:var(--red-bg)}
.loading{text-align:center;padding:3rem 1rem;color:var(--text3)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.autocomplete-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;max-height:220px;overflow-y:auto;margin-top:4px}
.ac-item{padding:10px 14px;cursor:pointer;border-bottom:.5px solid var(--border);font-size:14px}
.ac-item:last-child{border-bottom:none}
.ac-item:active,.ac-item:hover{background:var(--bg2)}
.ac-code{font-size:11px;color:var(--text3);margin-right:6px}
.ac-cat{font-size:11px;color:var(--blue-text);background:var(--blue-bg);padding:1px 6px;border-radius:8px;margin-left:6px}
.ac-sev-d{font-size:11px;color:var(--red);background:var(--red-bg);padding:1px 6px;border-radius:8px;margin-left:4px}
</style>
</head>

<script type="module">

const app=initializeApp({apiKey:"AIzaSyCOTu_Qgm3OEqMJeCM-O1jlQiGT0tH9LSo",authDomain:"safety-defect-db.firebaseapp.com",projectId:"safety-defect-db",storageBucket:"safety-defect-db.firebasestorage.app",messagingSenderId:"1046696882718",appId:"1:1046696882718:web:e7d1b4c994f15d19c0740f"});
const db=getFirestore(app);
const auth=getAuth(app);
const storage=getStorage(app);
// ── App 版本 & 一鍵更新（解決 iOS 主畫面 App 快取舊版問題）──
const APP_VERSION='5';  // 每次部署改版時，把這個數字 +1
window.forceUpdate=async function(){
  try{
    // 1. 清掉所有 Cache Storage（PWA 快取）
    if('caches' in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    // 2. 註銷 Service Worker（若有）
    if('serviceWorker' in navigator){ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); }
  }catch(e){}
  // 3. 帶時間戳重新載入，強迫 iOS 丟掉頁面快取抓最新版
  const u=new URL(location.href); u.searchParams.set('_v', Date.now());
  location.replace(u.toString());
};
// 載入時顯示版本號、並把 _v 參數從網址移除（避免累積）
(function(){
  try{
    const ve=document.getElementById('appVer'); if(ve) ve.textContent=APP_VERSION;
    if(new URL(location.href).searchParams.has('_v')){
      const u=new URL(location.href); u.searchParams.delete('_v');
      history.replaceState(null,'',u.toString());
    }
  }catch(e){}
})();

// ══════════ 匯出功能（Excel / PDF，含照片，匯出目前篩選結果）══════════
function exportRows(){ return (window.currentFiltered||[]).slice(); }
function lawText(r){ const ls=r.laws&&r.laws.length?r.laws:(r.law?[{name:r.law,no:''}]:[]); return ls.map(l=>l.name+(l.no?'第'+l.no+'條':'')).join('、'); }
// 把一張照片網址抓成 base64（失敗回 null，不讓整體中斷）
async function fetchImgB64(url){
  try{ const res=await fetch(url,{mode:'cors'}); if(!res.ok)return null; const blob=await res.blob();
    return await new Promise(rs=>{const fr=new FileReader();fr.onload=()=>rs(fr.result);fr.onerror=()=>rs(null);fr.readAsDataURL(blob);}); }
  catch(e){ return null; }
}

// ── 匯出 Excel（用 ExcelJS，照片嵌入儲存格）──
window.exportExcel=async function(){
  const rows=exportRows();
  if(!rows.length){toast('目前沒有可匯出的資料');return;}
  toast('產生 Excel 中，請稍候…');
  try{
    if(!window.ExcelJS){ await import('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); }
    const ExcelJS=window.ExcelJS;
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('缺失清單');
    ws.columns=[
      {header:'項次',key:'no',width:6},{header:'案名',key:'project',width:18},
      {header:'日期',key:'date',width:12},{header:'缺失類別',key:'cat',width:16},
      {header:'嚴重等級',key:'sev',width:10},{header:'缺失事項',key:'title',width:50},
      {header:'法規依據',key:'law',width:24},{header:'地點',key:'location',width:14},
      {header:'照片',key:'photo',width:22},
    ];
    ws.getRow(1).font={bold:true};ws.getRow(1).alignment={vertical:'middle',horizontal:'center'};
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      const row=ws.addRow({no:i+1,project:r.project||'',date:r.date||'',cat:catDisplay(r.cat),sev:r.sev||'',title:r.title||r.desc||'',law:lawText(r),location:r.location||''});
      row.alignment={vertical:'top',wrapText:true};
      // 嵌照片
      const ph=(typeof photoList==='function')?photoList(r):[];
      if(ph.length){
        const b64=await fetchImgB64(ph[0]);
        if(b64){
          const ext=b64.substring(b64.indexOf('/')+1,b64.indexOf(';'));
          const imgId=wb.addImage({base64:b64,extension:(ext==='jpeg'?'jpeg':(ext==='png'?'png':'jpeg'))});
          row.height=90;
          ws.addImage(imgId,{tl:{col:8,row:row.number-1},ext:{width:120,height:118}});
        }
      }
    }
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`安衛缺失_${new Date().toISOString().slice(0,10)}.xlsx`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast(`已匯出 ${rows.length} 筆 Excel`);
  }catch(e){ toast('Excel 匯出失敗：'+e.message); }
};

// ── 匯出 PDF（開列印視窗，可直接列印或存 PDF；照片以 <img> 呈現）──
window.exportPDF=async function(){
  const rows=exportRows();

  toast('準備列印畫面，請稍候…');
  // 先把照片抓成 base64（避免列印時圖還沒載入 / 被防火牆擋）
  const imgs=await Promise.all(rows.map(async r=>{const ph=(typeof photoList==='function')?photoList(r):[];return ph.length?(await fetchImgB64(ph[0])):null;}));
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const trs=rows.map((r,i)=>`<tr>

    <td>${esc(catDisplay(r.cat))}<br><span class="sub">${esc(r.sev)}</span></td>
    <td>${esc(r.title||r.desc)}<br><span class="sub">${esc(lawText(r))}</span></td>
    <td class="c">${imgs[i]?`<img src="${imgs[i]}">`:'<span class="sub">無照片</span>'}</td>
  </tr>`).join('');
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>安衛缺失清單</title>
  <style>
    body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;margin:16px;color:#222}
    h1{font-size:18px;margin:0 0 4px}.meta{font-size:12px;color:#666;margin-bottom:12px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid #999;padding:6px 8px;vertical-align:top;text-align:left}
    th{background:#f0f0f0}.c{text-align:center}
    .sub{color:#777;font-size:11px}
    img{width:130px;height:auto;border-radius:4px}

  </style></head><body>

const CN_NUM={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
function catDisplay(cat){
  if(!cat)return '';
  if(cat==='全部')return '全部';
  const m=cat.match(/^(十一|十二|十|[一二三四五六七八九])、(.+)$/);
  if(m){const n=CN_NUM[m[1]];if(n)return n+'. '+m[2];}
  return cat;
}
// 顯示用：完全去掉編號，只留類別名稱（用於個別缺失卡片）
function catNoNum(cat){
  if(!cat||cat==='全部')return cat||'';
  const m=cat.match(/^(十一|十二|十|[一二三四五六七八九])、(.+)$/);
  return m?m[2]:cat;
}

function projColor(name){
  if(!name)return{bg:'#eee',fg:'#666',dot:'#999'};
  let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%360;
  return{bg:`hsl(${h},70%,92%)`,fg:`hsl(${h},60%,32%)`,dot:`hsl(${h},65%,42%)`};
}

window.updLaw=function(p,idx){
  const row=document.getElementById(p+'_lr_'+idx);if(!row)return;
  const sv=row.querySelector('select').value,no=row.querySelector('input').value.trim();
  const hint=document.getElementById(p+'_lh_'+idx);

function getLaws(p){

    const customEl=row.querySelector('.law-custom');

    if(!sv&&customVal)return{sel:'',name:customVal,no:'',link:''};
    const[n,pc]=sv.split('|');

window.aiGenerate = async function() {
  const title = document.getElementById('f_title').value.trim();
  if (!title) { toast('請先填寫缺失名稱'); return; }

  const btn = document.getElementById('aiGenBtn');
  const status = document.getElementById('aiStatus');
  btn.disabled = true;
  btn.innerHTML = '✨ AI 產生中…';
  status.style.display = 'block';
  status.textContent = '正在分析缺失內容，請稍候…';

  try {
    const resp = await fetch('https://aianalyze-fz6cuwkiua-uc.a.run.app', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });

    const result = await resp.json();
    if (result.error) throw new Error(result.error);

    // 填入其他欄位
    if (result.hazard) document.getElementById('f_hazard').value = result.hazard;
    if (result.improve) document.getElementById('f_improve').value = result.improve;
    if (result.plain) document.getElementById('f_plain').value = result.plain;

    // 顯示相關法條建議清單
    const lawsWrap = document.getElementById('f_laws_wrap');
    lawsWrap.innerHTML = '';
    const suggestId = 'ai_law_suggest';
    const old = document.getElementById(suggestId);
    if (old) old.remove();

    if (result.laws && result.laws.length) {
      const box = document.createElement('div');
      box.id = suggestId;
      box.style.cssText = 'margin-top:8px;padding:10px 12px;background:var(--blue-bg,#eef4ff);border:1px solid var(--blue,#3a7bd5);border-radius:10px;font-size:13px;';
      box.innerHTML = '<div style="font-weight:600;color:var(--blue-text,#1a4fa0);margin-bottom:8px">📋 AI 建議相關法條（點選帶入）</div>';
      result.laws.forEach(law => {
        const pcode = law.law_pcode || '';
        const no = law.law_no || '';
        const name = law.law_name || '';
        const lawtext = law.lawtext || '';
        const btn = document.createElement('div');
        btn.style.cssText = 'padding:7px 10px;margin-bottom:6px;background:white;border:1px solid #c5d8f5;border-radius:8px;cursor:pointer;';
        const inList = Object.keys(LAW_PCODE_MAP).includes(name);
        btn.innerHTML = '<span style="font-weight:600;color:#1a4fa0">' + name + '第' + no + '條</span>' + (!inList ? '<span style="color:#e07;font-size:11px;margin-left:6px">⚠️ 不在清單</span>' : '') + '<div style="color:#888;font-size:11px;margin-top:3px" class="law-preview">點擊查詢真實條文</div>';
        btn.onclick = async function() {
          lawsWrap.innerHTML = '';
          addLaw('f');
          const rows = lawsWrap.querySelectorAll('.law-row');
          const row = rows[rows.length - 1];
          const sel = row.querySelector('select');
          const noEl = row.querySelector('.law-no');
          const rowId = row.id.split('_lr_')[1];
          const customEl = document.getElementById('f_lc_' + rowId);
          // 查詢真實條文
          const realText = await fetchLawArticle(name, no);
          let matched = false;
          Array.from(sel.options).forEach(opt => {
            if (pcode && opt.value.includes(pcode)) { sel.value = opt.value; matched = true; }
          });
          if (!matched && name) Array.from(sel.options).forEach(opt => {
            if (opt.text && name && opt.text.includes(name.substring(0, 8))) { sel.value = opt.value; matched = true; }
          });
          if (no) noEl.value = no;
          if(realText && customEl) {
            customEl.value = realText;
            customEl.style.display = 'block';
          } else if(!matched && customEl) {
            // 不在下拉選單：直接用自訂欄位輸入法規名稱+條號
            sel.value = '';
            noEl.value = '';
            customEl.value = name + '第' + no + '條' + (realText ? '：' + realText : '');
            customEl.style.display = 'block';
          }
          setTimeout(() => updLaw('f', rowId), 80);
          document.getElementById(suggestId).remove();
        };
        box.appendChild(btn);
      });
      lawsWrap.parentNode.insertBefore(box, lawsWrap);
    }

    status.textContent = '✅ AI 已填入，請點選適合的法條後儲存';
    status.style.color = 'var(--green)';
  } catch(e) {
    status.textContent = '❌ 產生失敗，請手動填寫';
    status.style.color = 'var(--red)';
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ AI 自動產生法規、危害說明、改善建議';
  }
};

window.acSearch = function(q) {
  const list = document.getElementById('acList');
  if (!q || q.length < 1) { list.style.display='none'; return; }
  const matched = DEFECT_TEMPLATES.filter(t => t.title.includes(q) || t.code.includes(q)).slice(0, 12);
  if (!matched.length) { list.style.display='none'; return; }
  list.innerHTML = matched.map(t => `
    <div class="ac-item" onclick="acPick(${JSON.stringify(t).replace(/"/g,'&quot;')})">
      <span class="ac-code">${t.code}</span>${t.title}
      <span class="ac-cat">${t.cat}</span>
      ${t.sev==='立即危險'?'<span class="ac-sev-d">立即危險</span>':''}
    </div>`).join('');
  list.style.display = 'block';
};

// ── 查詢真實法條 ──
const LAW_PCODE_MAP = {
  '職業安全衛生法': 'N0060001',
  '職業安全衛生設施規則': 'N0060009',
  '營造安全衛生設施標準': 'N0060014',
  '職業安全衛生管理辦法': 'N0060008',
  '危險性機械及設備安全檢查規則': 'N0060006',
  '營建工程空氣污染防制設施管理辦法': 'O0020058',
};
const lawCache = {};

async function fetchLawArticle(lawName, articleNo) {
  const pcode = LAW_PCODE_MAP[lawName];
  if(!pcode) return null;
  const cacheKey = pcode + '_' + articleNo;
  if(lawCache[cacheKey]) return lawCache[cacheKey];
  try {
    const url = `https://raw.githubusercontent.com/kong0107/mojLawSplitJSON/master/FalVMingLing/${pcode}.json`;
    const resp = await fetch(url);
    if(!resp.ok) return null;
    const data = await resp.json();
    const articles = data['法規內容'] || data.articles || [];
    const target = String(articleNo).replace(/[^\d]/g,'');
    const found = articles.find(a => {
      const aNo = String(a['條號'] || a.number || '').replace(/[^\d]/g,'');
      return aNo === target;
    });
    if(found) {
      const text = (found['條文內容'] || found.content || '').replace(/\r/g,'').trim();
      lawCache[cacheKey] = text;
      return text;
    }
    return null;
  } catch(e) {
    console.log('法條查詢失敗:', e);
    return null;
  }
}

// 依目前選定的法規＋條號，自動上網抓條文原文填入「法規原文」欄
window.fillLawText=async function(p){
  const laws=getLaws(p);
  const status=document.getElementById(p+'_lawtext_status');
  const ta=document.getElementById(p+'_lawtext');
  const named=laws.filter(l=>l.name&&l.no&&LAW_PCODE_MAP[l.name]);
  if(!laws.length){if(status){status.textContent='請先在上方選擇法規並填條號';status.style.color='#e07';}return;}
  if(!named.length){if(status){status.textContent='所選法規不在可查清單，或缺條號';status.style.color='#e07';}return;}
  if(status){status.textContent='查詢中…';status.style.color='#888';}
  const parts=[];let okN=0,failN=0;
  for(const l of named){
    const txt=await fetchLawArticle(l.name,l.no);
    if(txt){parts.push(`【${l.name}第${l.no}條】\n${txt}`);okN++;}
    else{parts.push(`【${l.name}第${l.no}條】（查無條文，請手動確認）`);failN++;}
  }
  const existing=ta.value.trim();
  ta.value=(existing?existing+'\n\n':'')+parts.join('\n\n');
  if(status){
    status.textContent=failN?`已帶出 ${okN} 條，${failN} 條查無`:`✅ 已帶出 ${okN} 條原文`;
    status.style.color=failN?'#e07':'var(--green,#2a8a4a)';
  }
};

    isAdmin = true;
    userRole = 'admin';
    userProjects = [];
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('pendingScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('userBar').style.display = 'none';
    await loadProjects();
    await loadRecords();
  }
});
</script>
